name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: newsintel
          POSTGRES_USER: newsintel
          POSTGRES_PASSWORD: newsintel-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U newsintel -d newsintel"
          --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports: ["6333:6333"]
    env:
      NEWSINTEL_ENVIRONMENT: test
      NEWSINTEL_DATABASE_URL: postgresql+asyncpg://newsintel:newsintel-ci@127.0.0.1:5432/newsintel
      NEWSINTEL_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reproducible locked dependencies from public PyPI
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --all-extras --locked
      # Existing repository has >1,200 full Ruff diagnostics (chiefly E501).
      # Keep fatal syntax/undefined-name checks gating CI; track style cleanup separately.
      - name: Critical syntax and undefined-name lint
        run: uv run ruff check --select E9,F821,F822,F823 backend/src backend/tests scripts
      - run: uv run python -m compileall -q backend/src backend/tests backend/migrations
      - run: uv run alembic -c backend/alembic.ini upgrade head
      - name: Create dedicated PostgreSQL integration test database
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg

          async def prepare() -> None:
              conn = await asyncpg.connect(
                  host="127.0.0.1",
                  database="newsintel",
                  user="newsintel",
                  password="newsintel-ci",
              )
              try:
                  await conn.execute("CREATE DATABASE newsintel_audit_ci")
              finally:
                  await conn.close()

          asyncio.run(prepare())
          PY
      - name: Migrate dedicated PostgreSQL integration database
        env:
          NEWSINTEL_DATABASE_URL: postgresql+asyncpg://newsintel:newsintel-ci@127.0.0.1:5432/newsintel_audit_ci
        run: uv run alembic -c backend/alembic.ini upgrade head
      - name: Run unit and PostgreSQL integration tests
        env:
          NEWSINTEL_TEST_DATABASE_URL: postgresql+asyncpg://newsintel:newsintel-ci@127.0.0.1:5432/newsintel_audit_ci
        run: uv run pytest -q
      - run: uv run python scripts/release-integrity.py
      - run: docker build -t news-intelligence:${{ github.sha }} .

  windows-unit:
    name: Windows compatibility
    runs-on: windows-latest
    env:
      NEWSINTEL_ENVIRONMENT: test
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked Windows dependencies
        run: uv sync --all-extras --locked
      - name: Run Windows unit and long-path regression tests
        run: uv run pytest -q backend/tests/unit

  s3-integration:
    name: S3-compatible artifact persistence
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.14.0
        ports: ["4566:4566"]
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
    env:
      NEWSINTEL_ENVIRONMENT: test
      UV_DEFAULT_INDEX: https://pypi.org/simple
      NEWSINTEL_TEST_S3_ENDPOINT: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: uv sync --all-extras --locked
      - name: Wait for local S3 emulator
        run: |
          uv run python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          for attempt in range(40):
              try:
                  with urlopen("http://127.0.0.1:4566/_localstack/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except (OSError, URLError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("LocalStack S3 health endpoint unavailable")
          PY
      - name: Test raw object write, readback, and immutability
        run: uv run pytest -q backend/tests/integration/test_artifact_storage_s3.py
