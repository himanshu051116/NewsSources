name: Pages showcase

on:
  pull_request:
    branches: [main]
    paths:
      - "showcase/**"
      - ".github/scripts/validate_showcase.py"
      - ".github/workflows/pages-showcase.yml"
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - ".github/scripts/validate_showcase.py"
      - ".github/workflows/pages-showcase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-sources-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static showcase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate local links, labels and accessibility structure
        run: python3 .github/scripts/validate_showcase.py
      - name: Check JavaScript syntax
        run: node --check showcase/app.js

  browser-smoke:
    name: Browser regression (desktop and mobile)
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test dependency
        working-directory: showcase/tests
        run: npm install --no-audit --no-fund --ignore-scripts --package-lock=false
      - name: Install Chromium and system libraries
        working-directory: showcase/tests
        run: npx playwright install --with-deps chromium
      - name: Run browser-level workbench checks
        working-directory: showcase/tests
        run: npm test
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-failure-traces
          path: showcase/tests/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only public static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: showcase
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
