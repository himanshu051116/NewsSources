name: news-intelligence-production

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: [.env.production]
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks: [backend]
  read_only: true
  tmpfs: [/tmp:size=256m]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsintel}
      POSTGRES_USER: ${POSTGRES_USER:-newsintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsintel} -d ${POSTGRES_DB:-newsintel}"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes: [qdrant-data:/qdrant/storage]
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    networks: [backend]
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/${NEWSINTEL_OBJECT_STORE_BUCKET:-newsintel};
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      NEWSINTEL_OBJECT_STORE_BUCKET: ${NEWSINTEL_OBJECT_STORE_BUCKET:-newsintel}

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]

  api:
    <<: *app
    command: ["newsintel-api"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    expose: ["8010"]

  poller:
    <<: *app
    command: ["newsintel-poller"]

  articles:
    <<: *app
    command: ["newsintel-articles"]

  historical-enrichment:
    <<: *app
    command: ["newsintel-historical-enrichment"]

  briefings:
    <<: *app
    command: ["newsintel-briefings"]

  outbox:
    <<: *app
    command: ["newsintel-outbox"]

  recompute:
    <<: *app
    command: ["newsintel-recompute"]

  workspace-monitor:
    <<: *app
    command: ["newsintel-workspace-monitor"]

  browser-renderer:
    profiles: ["browser-renderer"]
    build:
      context: .
      dockerfile: docker-browser-renderer.Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp:size=256m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEWSINTEL_DOMAIN: ${NEWSINTEL_DOMAIN:?Set NEWSINTEL_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
  caddy-data:
  caddy-config:
